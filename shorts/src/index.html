/* narration word timings per scene: [word, start, end] (seconds, relative to clip start, after 1.15x) */
const WORDS=[[["보호하려고",0,0.53],["옮겼는데,",0.6,1.574],["왜",1.643,1.783],["저만",1.852,2.061],["떠나야",2.13,2.339],["하죠?",2.409,2.826]],[["몇",0,0.112],["시간",0.182,0.391],["전,",0.495,1.017],["직장",1.121,1.365],["내",1.434,1.504],["괴롭힘",1.573,1.991],["상담",2.13,2.269],["요청이",2.339,2.617],["들어왔습니다.",2.652,3.66],["조사와",3.73,4.286],["보호조치를",4.425,4.843],["요청하는",4.912,5.33],["메일이었습니다.",5.399,6.234]],[["담당자는",0,0.593],["조사를",0.663,0.941],["준비하면서,",1.01,1.915],["우선",1.984,2.263],["마주치지",2.332,2.68],["않도록",2.75,3.236],["다른",3.306,3.515],["층에",3.584,3.932],["임시",4.036,4.21],["근무지를",4.28,4.697],["정했습니다.",4.732,5.393]],[["빠르게",0,0.299],["정한",0.368,0.577],["것은",0.646,0.994],["장소였습니다.",1.203,2.316],["아직",2.386,2.594],["묻지",2.699,2.873],["않은",2.942,3.081],["것은",3.186,3.638],["당사자의",3.777,4.194],["의사였습니다.",4.264,5.099]],[["다음",0,0.222],["주",0.291,0.361],["프로젝트",0.431,0.778],["발표는",0.848,1.335],["이",1.404,1.544],["직원이",1.613,1.891],["맡고",1.961,2.146],["있었습니다.",2.193,3.213],["마주치는",3.283,3.7],["건",3.77,3.909],["줄이고",3.978,4.187],["싶지만,",4.257,5.022],["맡은",5.161,5.3],["일은",5.37,5.648],["계속하고",5.718,6.135],["싶다는",6.204,6.483],["것.",6.587,7.318],["무엇을",7.457,7.804],["피하고",7.874,8.083],["싶은지,",8.152,8.918],["무엇을",8.987,9.335],["계속하고",9.404,9.822],["싶은지",9.891,10.518],["함께",10.587,10.935],["확인해야",11.004,11.283],["합니다.",11.352,11.839]],[["기준은",0,0.523],["조사",0.662,0.871],["중과",1.01,1.427],["확인",1.566,1.706],["후가",1.845,2.053],["다릅니다.",2.192,3.166],["조사",3.236,3.445],["중에는",3.514,3.932],["필요한",4.001,4.279],["경우",4.419,4.627],["적절한",4.766,5.045],["조치를",5.114,5.392],["하되,",5.462,6.019],["당사자의",6.158,6.575],["의사에",6.645,6.923],["반해서는",7.062,7.479],["안",7.549,7.619],["됩니다.",7.792,8.732],["괴롭힘이",8.836,9.149],["확인된",9.288,9.566],["뒤에는",9.636,10.123],["피해근로자가",10.262,10.819],["요청하면,",10.888,11.723],["요청",11.862,12.14],["취지와",12.21,12.697],["사업장",12.836,13.114],["여건을",13.253,13.532],["고려해",13.671,14.019],["조치합니다.",14.088,14.784]],[["근무장소",0,0.517],["변경이나",0.657,1.213],["유급휴가",1.283,1.7],["등",1.77,2.117],["상황에",2.187,2.465],["맞는",2.535,2.744],["방법을",2.813,3.091],["검토하되,",3.196,4.204],["신고자와",4.344,4.9],["피해근로자등에",4.97,5.665],["대한",5.735,5.944],["해고",6.013,6.222],["등",6.361,6.639],["불리한",6.709,7.057],["처우는",7.126,7.474],["금지됩니다.",7.544,8.309]],[["그래서",0,0.456],["먼저",0.526,0.665],["물었습니다.",0.735,1.709],["어떤",1.778,2.056],["상황이",2.126,2.543],["가장",2.613,2.822],["걱정되는지.",2.926,4.074],["자리",4.143,4.282],["이동은",4.352,4.63],["보류하고,",4.7,5.465],["회의",5.535,5.743],["운영부터",5.813,6.23],["조정할",6.3,6.578],["수",6.648,6.717],["있는지",6.856,7.204],["확인하기로",7.274,7.622],["했습니다.",7.83,8.596],["조사는",8.665,9.013],["계속하고,",9.048,9.778],["보호조치의",9.848,10.335],["효과도",10.439,10.822],["확인합니다.",10.891,11.517]],[["보호조치의",0,0.528],["출발점은",0.597,1.293],["당사자에게",1.363,1.919],["묻는",1.989,2.128],["것입니다.",2.197,3.171],["어떤",3.241,3.519],["조치가",3.589,4.076],["안전하게",4.18,4.563],["일하는",4.632,4.91],["데",4.98,5.049],["도움이",5.119,5.328],["되는지,",5.467,6.163],["먼저",6.267,6.719],["당사자의",6.789,7.276],["의사를",7.345,7.693],["확인하십시오.",7.763,8.528]],[["상생의",0,0.389],["노동법,",0.458,1.224],["박재우",1.363,1.571],["변호사였습니다.",1.711,2.545]]];
const CLIP=[2.658,6.014,5.218,4.920,11.624,14.559,8.077,11.331,8.305,2.316]; // processed clip lengths

/* ---------- utils ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const ee=t=>t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1; // elastic
function font(w,s){ctx.font=`${w} ${s}px P`;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(s,x,y,{w=800,size=48,color=C.ink,align='left',ls=0,alpha=1,base='alphabetic'}={}){
  ctx.save();ctx.globalAlpha*=alpha;font(w,size);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;
  ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.restore();}
function tw(s,w,size,ls=0){ctx.save();font(w,size);ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m;}
function rise(p,dy=40){return {a:eo(p),y:(1-eo(p))*dy};}
function hl(x,y,w,h,p,color=C.yellow){if(p<=0)return;ctx.save();ctx.fillStyle=color;ctx.globalAlpha*=.9;
  rr(x,y,w*eo(p),h,6);ctx.fill();ctx.restore();}
function pop(p){return p<=0?0:eb(p);}
function withT(x,y,s,a,fn){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.scale(s,s);fn();ctx.restore();}
function shadowCard(x,y,w,h,r=28,fill=C.card){ctx.save();ctx.shadowColor='rgba(30,40,56,.14)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;
  ctx.fillStyle=fill;rr(x,y,w,h,r);ctx.fill();ctx.restore();}
function typed(s,p){return s.slice(0,Math.round(s.length*clamp(p)));}
// mouth flap while speaking in [a,b]
function flap(t,a,b){if(t<a||t>b)return 0;return Math.abs(Math.sin((t-a)*13))*(.55+.45*Math.sin(t*5.3));}
function nodv(t,a){const p=P(t,a,a+.6);return Math.sin(p*Math.PI*2)*6*(1-p);}

function bubble(cx,cy,lines,p,{size=42,w=700,tail=[0,0],fill=C.paper,color=C.ink,think=false,weight=700,lh=1.42}={}){
  if(p<=0)return;const s=pop(p);
  font(weight,size);let mw=0;lines.forEach(l=>mw=Math.max(mw,ctx.measureText(l).width));
  const bw=Math.min(w,mw+90),bh=lines.length*size*lh+60;
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.globalAlpha*=clamp(p*3);
  ctx.shadowColor='rgba(30,40,56,.16)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;
  ctx.fillStyle=fill;ctx.strokeStyle=C.ink;ctx.lineWidth=4;
  rr(-bw/2,-bh/2,bw,bh,bh>140?44:bh/2);ctx.fill();ctx.shadowColor='transparent';ctx.stroke();
  const [tx,ty]=tail;
  if(think){[[.85,16],[1.08,10]].forEach(([k,r])=>{ctx.beginPath();ctx.arc(tx*k,ty*k,r,0,7);ctx.fill();ctx.stroke();});}
  else if(tx||ty){const ex=clamp(tx,-bw/2+50,bw/2-50),ey=ty>0?bh/2-4:-bh/2+4;
    ctx.beginPath();ctx.moveTo(ex-24,ey);ctx.lineTo(tx,ty);ctx.lineTo(ex+24,ey);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(ex-24,ey);ctx.lineTo(tx,ty);ctx.lineTo(ex+24,ey);ctx.stroke();
    ctx.fillRect(ex-22,ey-(ty>0?8:-2),44,6);}
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  lines.forEach((l,i)=>ctx.fillText(l,0,-bh/2+30+size*lh*(i+.5)));
  ctx.restore();}

/* flat character, head centre at (x,y). talk: mouth open 0..1, nod: head offset px, arm: gesture angle (rad) or null */
function person(x,y,s,o={}){
  const {top=C.olive,hair='bob',mood='flat',look=0,glasses=false,tie=null,blink=false,shirt='#FFFCF2',cut=1e4,
    talk=0,nod=0,arm=null,t=0}=o;
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.rect(-400,-400,800,400+cut);ctx.clip();
  const br=1+Math.sin(t*2.3)*.012; // breathing
  // back hair
  ctx.save();ctx.translate(0,nod);
  ctx.fillStyle=C.hair;
  if(hair==='bob'){ctx.beginPath();ctx.ellipse(0,8,92,96,0,0,7);ctx.fill();rr(-92,0,184,90,40);ctx.fill();}
  ctx.restore();
  // body
  ctx.save();ctx.translate(0,95);ctx.scale(1,br);ctx.translate(0,-95);
  ctx.fillStyle=top;rr(-150,95,300,320,[120,120,30,30]);ctx.fill();
  ctx.fillStyle=shirt;ctx.beginPath();ctx.moveTo(-48,95);ctx.lineTo(48,95);ctx.lineTo(0,215);ctx.closePath();ctx.fill();
  if(tie){ctx.fillStyle=tie;ctx.beginPath();ctx.moveTo(-12,108);ctx.lineTo(12,108);ctx.lineTo(18,200);ctx.lineTo(0,222);ctx.lineTo(-18,200);ctx.closePath();ctx.fill();}
  else{ctx.strokeStyle=C.navy;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-40,100);ctx.lineTo(0,235);ctx.lineTo(40,100);ctx.stroke();
    ctx.fillStyle='#fff';rr(-26,232,52,64,8);ctx.fill();ctx.strokeStyle=C.navy;ctx.lineWidth=4;ctx.stroke();}
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-50,98);ctx.lineTo(-8,230);ctx.moveTo(50,98);ctx.lineTo(8,230);ctx.stroke();
  ctx.restore();
  // neck
  ctx.fillStyle=C.skinS;rr(-22,55,44,52,10);ctx.fill();
  // head group
  ctx.save();ctx.translate(0,nod);ctx.rotate(nod*.004);
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.ellipse(0,0,70,80,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(-70,8,12,18,0,0,7);ctx.ellipse(70,8,12,18,0,0,7);ctx.fill();
  ctx.fillStyle=C.hair;
  if(hair==='bob'){ctx.beginPath();ctx.moveTo(-82,40);ctx.quadraticCurveTo(-95,-80,0,-88);ctx.quadraticCurveTo(95,-80,82,40);
    ctx.quadraticCurveTo(70,-20,30,-40);ctx.quadraticCurveTo(-10,-20,-50,-30);ctx.quadraticCurveTo(-70,-10,-82,40);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(-74,0);ctx.quadraticCurveTo(-82,-92,0,-92);ctx.quadraticCurveTo(84,-92,74,0);
    ctx.quadraticCurveTo(66,-40,20,-44);ctx.quadraticCurveTo(-30,-30,-60,-40);ctx.quadraticCurveTo(-72,-24,-74,0);ctx.fill();}
  const ex=look*10;ctx.fillStyle=C.ink;
  if(blink){ctx.fillRect(-36+ex,10,22,4);ctx.fillRect(14+ex,10,22,4);}
  else{ctx.beginPath();ctx.ellipse(-25+ex,12,8,11,0,0,7);ctx.ellipse(25+ex,12,8,11,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-22+ex,8,2.6,0,7);ctx.arc(28+ex,8,2.6,0,7);ctx.fill();}
  ctx.strokeStyle=C.hair;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();
  if(mood==='sad'||mood==='worry'){ctx.moveTo(-40,-14);ctx.lineTo(-14,-22);ctx.moveTo(40,-14);ctx.lineTo(14,-22);}
  else{ctx.moveTo(-40,-16);ctx.lineTo(-12,-18);ctx.moveTo(40,-16);ctx.lineTo(12,-18);}
  ctx.stroke();
  if(glasses){ctx.strokeStyle='#222';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-48+ex,-4,40,32,9);ctx.roundRect(8+ex,-4,40,32,9);
    ctx.moveTo(-8+ex,8);ctx.lineTo(8+ex,8);ctx.stroke();}
  // mouth
  if(talk>.05){ctx.fillStyle='#7A3B30';ctx.beginPath();ctx.ellipse(0,46,12+3*talk,3+12*talk,0,0,7);ctx.fill();
    if(talk>.4){ctx.fillStyle='#E07A6E';ctx.beginPath();ctx.ellipse(0,46+8*talk,8,3*talk,0,0,7);ctx.fill();}}
  else{ctx.strokeStyle='#8A4B3B';ctx.lineWidth=5;ctx.beginPath();
    if(mood==='smile'){ctx.arc(0,36,16,.15*Math.PI,.85*Math.PI);}
    else if(mood==='sad'){ctx.arc(0,56,13,1.2*Math.PI,1.8*Math.PI);}
    else if(mood==='worry'){ctx.moveTo(-12,48);ctx.quadraticCurveTo(0,42,12,48);}
    else{ctx.moveTo(-11,46);ctx.lineTo(11,46);}
    ctx.stroke();}
  ctx.fillStyle='rgba(230,140,120,.25)';ctx.beginPath();ctx.ellipse(-44,34,12,7,0,0,7);ctx.ellipse(44,34,12,7,0,0,7);ctx.fill();
  ctx.restore();
  // gesturing arm (right side of the image)
  if(arm!==null){ctx.save();ctx.translate(118,150);ctx.rotate(arm);ctx.fillStyle=top;rr(-30,-10,60,170,30);ctx.fill();
    ctx.fillStyle=shirt;rr(-30,140,60,22,8);ctx.fill();
    ctx.fillStyle=C.skin;ctx.beginPath();ctx.ellipse(0,190,30,36,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(-24,172,10,22,-.5,0,7);ctx.fill();ctx.restore();}
  ctx.restore();}

function tag(x,y,label,p,bg=C.navy,fg='#fff'){if(p<=0)return;const a=eo(p);font(800,40);const w=ctx.measureText(label).width+56;
  ctx.save();ctx.globalAlpha*=a;ctx.translate(x-(1-a)*60,y);ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,0);ctx.lineTo(w-14,70);ctx.lineTo(0,70);ctx.closePath();ctx.fill();
  ctx.fillStyle=fg;ctx.textBaseline='middle';ctx.fillText(label,26,37);ctx.restore();}

// headline: per-line start times
function headline(lines,t,starts,{y=330,size=86,hlc=C.yellow}={}){
  lines.forEach((l,i)=>{const t0=starts[i];const p=P(t,t0,t0+.4);if(p<=0)return;const s=lerp(1.25,1,eb(p));
    const w=tw(l,900,size,-2),x=W/2,yy=y+i*size*1.25;
    ctx.save();ctx.globalAlpha*=clamp(p*2.5);ctx.translate(x,yy);ctx.scale(s,s);ctx.translate(-x,-yy);
    hl(x-w/2-14,yy-size*.38,w+28,size*.48,P(t,t0+.2,t0+.6),hlc);
    txt(l,x,yy,{w:900,size,align:'center',ls:-2});ctx.restore();});}

function checkMark(x,y,s,p,color=C.olive){if(p<=0)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=10*s;ctx.lineCap='round';ctx.lineJoin='round';
  const pts=[[x-22*s,y],[x-6*s,y+16*s],[x+24*s,y-18*s]];const L1=Math.hypot(16,16),L2=Math.hypot(30,34),tot=L1+L2;const d=eo(p)*tot;
  ctx.beginPath();ctx.moveTo(...pts[0]);if(d<=L1){const k=d/L1;ctx.lineTo(lerp(pts[0][0],pts[1][0],k),lerp(pts[0][1],pts[1][1],k));}
  else{ctx.lineTo(...pts[1]);const k=(d-L1)/L2;ctx.lineTo(lerp(pts[1][0],pts[2][0],k),lerp(pts[1][1],pts[2][1],k));}ctx.stroke();ctx.restore();}
// accent burst lines (emphasis)
function burst(x,y,p,color=C.yellow,r0=40,r1=80,n=6,rot=0){if(p<=0||p>=1)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';
  const a=eo(p);for(let i=0;i<n;i++){const ang=rot+i*Math.PI*2/n;const ra=lerp(r0,r1,a),rb=lerp(r0,r1,Math.min(1,a+.35));
    ctx.globalAlpha=1-p;ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*ra,y+Math.sin(ang)*ra);ctx.lineTo(x+Math.cos(ang)*rb,y+Math.sin(ang)*rb);ctx.stroke();}ctx.restore();}

/* ---------- background ---------- */
function bg(t){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  const o=(t*12)%60; // slow drifting dot grid
  ctx.fillStyle='rgba(30,40,56,.05)';for(let y=40-o;y<H+60;y+=60)for(let x=40;x<W;x+=60){ctx.beginPath();ctx.arc(x,y,2.4,0,7);ctx.fill();}
  txt('상생의 노동법',W/2,140,{w:800,size:30,color:C.muted,align:'center',ls:2});}

/* ---------- scenes ----------
   f(t,e): t = scene-local seconds; e.w('word',n) = local start time of the n-th word starting with 'word';
   e.we(...) = its end time; e.end = narration end. sfx(e) returns [[type, localTime, dur?]]. */
const S=[];
// 1. Hook — headline is already on screen at frame 0
S.push({min:4.1,lead:.12,tail:.55,noCap:true,f(t,e){
  headline(['보호하려고 옮겼는데,','왜 저만 떠나야 하죠?'],t,[-.3,e.w('왜')-.1],{y:330});
  const pr=P(t,-.6,.1);const r=rise(pr,80);
  ctx.save();ctx.globalAlpha=r.a;ctx.translate(0,r.y);

const CAPS=[null,

// captions: phrases built from narration words, split at the hand-picked breaks above
const PHRASES=[];
S.forEach((s,i)=>{if(!CAPS[i])return;let k=0;
  CAPS[i].forEach(line=>{const n=line.split(' ').length,ph=s.words.slice(k,k+n).map(([w,a,b])=>[w.replace(/[.,?]$/,''),s.s+a,s.s+b]);
    if(ph.map(x=>x[0]).join(' ')!==line)console.log('caption mismatch',i+1,line,'|',ph.map(x=>x[0]).join(' '));
    PHRASES.push(ph);k+=n;});
  if(k!==s.words.length)console.log('caption words left over in scene',i+1);});
function captions(T){
  let ph=null;for(let i=0;i<PHRASES.length;i++){const p=PHRASES[i],st=p[0][1]-.06,en=Math.min(p[p.length-1][2]+.35,PHRASES[i+1]?PHRASES[i+1][0][1]-.06:1e9);

    if(curW){ctx.fillStyle=C.yellow;rr(x-8,-34,ws[i]+16,68,12);ctx.fill();}
    ctx.fillStyle=curW?C.ink:on?'#fff':'rgba(255,255,255,.5)';ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.fillText(w,x,3);x+=ws[i]+sp;});
  ctx.restore();}

/* draw one scene (without background) into the current ctx, mapped into the upper safe area with a slow camera push */
const SC=.86;
function drawScene(i,lt){const s=S[i];ctx.save();
  const z=1+.035*clamp(lt/s.d);ctx.translate(540,760);ctx.scale(z,z);ctx.translate(-540,-760);
  ctx.translate(540*(1-SC),90-120*SC);ctx.scale(SC,SC);
  try{s.f(lt,s.e);}catch(err){console.log('scene',i+1,err.message);}
  ctx.restore();}
// map a point in scene coordinates to screen (for iris centres)
const toScr=(x,y)=>[540*(1-SC)+x*SC,90-120*SC+y*SC];
const IRIS=[null,null,toScr(835,1116),null,null,null,toScr(540,1200),null,null];

function renderFrame(T){
  let i=S.findIndex(s=>T>=s.s&&T<s.s+s.d);if(i<0)i=S.length-1;const sc=S[i],lt=T-sc.s;
  ctx=mctx;bg(T);

  if(!inTrans){drawScene(i,lt);}
  else{const k=eio(lt/TD),type=TRANS[i-1],prev=S[i-1],plt=prev.d+lt;
    for(const [c,idx,tt] of [[actxA,i-1,plt],[actxB,i,lt]]){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);ctx=c;drawScene(idx,tt);}
    ctx=mctx;
    if(type==='push-left'){ctx.drawImage(offA,-W*k,0);ctx.drawImage(offB,W*(1-k),0);}
    else if(type==='push-up'){ctx.drawImage(offA,0,-H*k);ctx.drawImage(offB,0,H*(1-k));}
    else if(type==='zoom'){ctx.save();ctx.globalAlpha=1-k;ctx.translate(540,800);ctx.scale(1+.35*k,1+.35*k);ctx.translate(-540,-800);ctx.drawImage(offA,0,0);ctx.restore();
      ctx.save();ctx.globalAlpha=k;ctx.translate(540,800);ctx.scale(.88+.12*k,.88+.12*k);ctx.translate(-540,-800);ctx.drawImage(offB,0,0);ctx.restore();}
    else if(type==='iris'){ctx.drawImage(offA,0,0);const [cx,cy]=IRIS[i-1]||[540,800];const R=Math.hypot(Math.max(cx,W-cx),Math.max(cy,H-cy))*k;
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();bg(T);ctx.drawImage(offB,0,0);ctx.restore();
      ctx.save();ctx.strokeStyle=C.yellow;ctx.lineWidth=18*(1-k);ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.restore();}
    else if(type==='diag'){ctx.drawImage(offA,0,0);const ex=lerp(-700,W+700,k);
      ctx.save();ctx.beginPath();ctx.moveTo(-400,0);ctx.lineTo(ex,0);ctx.lineTo(ex-500,H);ctx.lineTo(-900,H);ctx.closePath();ctx.clip();bg(T);ctx.drawImage(offB,0,0);ctx.restore();
      ctx.save();ctx.fillStyle=C.yellow;ctx.beginPath();ctx.moveTo(ex,0);ctx.lineTo(ex+90,0);ctx.lineTo(ex-410,H);ctx.lineTo(ex-500,H);ctx.closePath();ctx.fill();ctx.restore();}
  }
  captions(T);
  ctx.fillStyle='rgba(30,40,56,.12)';ctx.fillRect(0,0,W,10);ctx.fillStyle=C.yellow;ctx.fillRect(0,0,W*T/TOTAL,10);
  const fo=P(T,TOTAL-.6,TOTAL);if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H);}
}
window.renderFrame=renderFrame;window.TOTAL=TOTAL;window.FPS=FPS;window.CUES=CUES;window.SFX=SFX;
