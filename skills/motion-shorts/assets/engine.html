<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>Motion Shorts</title>
<style>
@font-face{font-family:P;font-weight:500;src:url(fonts/Pretendard-Medium.woff2)}
@font-face{font-family:P;font-weight:700;src:url(fonts/Pretendard-Bold.woff2)}
@font-face{font-family:P;font-weight:800;src:url(fonts/Pretendard-ExtraBold.woff2)}
@font-face{font-family:P;font-weight:900;src:url(fonts/Pretendard-Black.woff2)}
html,body{margin:0;background:#000}
canvas{display:block;margin:0 auto;height:100vh;width:auto}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script src="portrait.js"></script>
<script src="badges.js"></script>
<script>
/* =====================================================================================
   motion-shorts engine. Edit CONFIG, the SCENES section, CAPS, TRANS and IRIS; leave the rest.
   Scene coordinates are a 1080x1920 design space. drawScene() scales them by CONFIG.safeScale
   into the upper part of the frame so captions (screen y≈1548) and the Shorts UI never cover
   content. Keep scene content between design y≈230 and y≈1680.
   Preview: open index.html in a browser (loops in real time). Render: scripts/render.js.
   ===================================================================================== */
const CONFIG={
  theme:'dark',                        // 'dark' = infographic / news / law change, 'paper' = warm story with characters
  series:'시리즈 제목 · 핵심 3',          // small line at the very top ('' hides it)
  items:3,                             // progress chips in the header (0 hides them); scenes set item:1..n or -1
  brand:'상생의 노동법  |  박재우 변호사',
  safeScale:.86,
  ending:'wave',                       // closing scene: 'wave' | 'seal' | 'tablet' | 'portrait' (new_project.py rotates them at random)
  polish:true,                         // texture/light/depth/spring motion layer (see SKILL.md); false = flat look
  grain:false,                         // animated film grain: off by default (4–5× file size, smeared by YouTube re-encoding)
  loop:true                            // last 0.5 s wipes back into frame 0 → seamless auto-replay
};
const W=1080,H=1920,FPS=30;
const main=document.getElementById('c'),mctx=main.getContext('2d');
const offA=new OffscreenCanvas(W,H),offB=new OffscreenCanvas(W,H);
const actxA=offA.getContext('2d'),actxB=offB.getContext('2d');
let ctx=mctx;   // every helper draws on the current ctx (swapped to offscreen canvases during transitions)
const THEMES={
  dark:{bg:'#11151C',bg2:'#171C25',panel:'#1D2430',panel2:'#263040',line:'#33405280',yellow:'#FFC629',yellowD:'#C99A10',orange:'#FF8A1F',
    red:'#FF4B4B',green:'#34D399',blue:'#5AA9FF',fg:'#F3F5F8',muted:'#8B96A8',ink:'#11151C',paper:'#FFFFFF',navy:'#2C4767',olive:'#5D6A30',
    skin:'#F3D3B8',skinS:'#E6BC9C',hair:'#2E241D',capBg:'rgba(243,245,248,.96)',capFg:'#11151C',capDim:'rgba(17,21,28,.38)',grid:'rgba(90,169,255,.05)',hazard2:'#111111'},
  paper:{bg:'#F4EEE2',bg2:'#EFE7D8',panel:'#FFFDF8',panel2:'#E6ECF3',line:'#DCD3C2',yellow:'#F6C945',yellowD:'#B8901A',orange:'#E8873A',
    red:'#D2483F',green:'#5D9A4A',blue:'#2F5FA8',fg:'#1E2838',muted:'#7B8392',ink:'#1E2838',paper:'#FFFFFF',navy:'#2C4767',olive:'#5D6A30',
    skin:'#F3D3B8',skinS:'#E6BC9C',hair:'#3A2A21',capBg:'rgba(30,40,56,.92)',capFg:'#FFFFFF',capDim:'rgba(255,255,255,.5)',grid:'rgba(30,40,56,.05)',hazard2:'#1E2838'}};
const C=THEMES[CONFIG.theme];
let TIMING=null; // window.TIMINGDATA from timing.js: {W:[[word,start,end],...] per scene, CLIP:[seconds per scene]}

/* ---------- utils ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function font(w,s){ctx.font=`${w} ${s}px P`;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function txt(s,x,y,{w=800,size=48,color=C.fg,align='left',ls=0,alpha=1,base='alphabetic'}={}){
  ctx.save();ctx.globalAlpha*=alpha;font(w,size);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;
  ctx.letterSpacing=ls+'px';ctx.fillText(s,x,y);ctx.restore();}
function tw(s,w,size,ls=0){ctx.save();font(w,size);ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m;}
function rise(p,dy=40){return {a:eo(p),y:(1-eo(p))*dy};}
const spr=p=>p<=0?0:p>=1?1:1-Math.exp(-6*p)*Math.cos(10.5*p);   // damped spring 0→1 with a small overshoot
function pop(p){return p<=0?0:CONFIG.polish?spr(p):eb(p);}
function withT(x,y,s,a,fn){ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.scale(s,s);fn();ctx.restore();}
function hl(x,y,w,h,p,color=C.yellow,alpha=1){if(p<=0)return;ctx.save();ctx.fillStyle=color;ctx.globalAlpha*=alpha;rr(x,y,w*eo(p),h,8);ctx.fill();ctx.restore();}
function panel(x,y,w,h,o={}){if(CONFIG.polish)return panelP(x,y,w,h,o);return panelFlat(x,y,w,h,o);}
// polished panel: vertical gradient, top highlight, long soft shadow (theme-aware)
function panelP(x,y,w,h,{fill=C.panel,r=28,stroke=C.line,glow=0}={}){const dk=CONFIG.theme==='dark';ctx.save();
  if(glow>0){ctx.shadowColor=`rgba(255,198,41,${.45*glow})`;ctx.shadowBlur=50*glow;}else{ctx.shadowColor=dk?'rgba(0,0,0,.5)':'rgba(30,40,56,.16)';ctx.shadowBlur=dk?48:40;ctx.shadowOffsetY=dk?26:20;}
  let f=fill;if(fill===C.panel){f=ctx.createLinearGradient(0,y,0,y+h);f.addColorStop(0,dk?'#26303F':'#FFFFFF');f.addColorStop(1,dk?'#1A212C':'#F7F1E6');}
  ctx.fillStyle=f;rr(x,y,w,h,r);ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle=glow>0?`rgba(255,198,41,${.9*glow})`:(stroke===C.line?(dk?'rgba(255,255,255,.07)':'rgba(30,40,56,.10)'):stroke);ctx.lineWidth=glow>0?4:2;ctx.stroke();
  ctx.save();rr(x,y,w,h,r);ctx.clip();const g=ctx.createLinearGradient(0,y,0,y+42);g.addColorStop(0,dk?'rgba(255,255,255,.10)':'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,42);ctx.restore();ctx.restore();}
function panelFlat(x,y,w,h,{fill=C.panel,r=28,stroke=C.line,glow=0}={}){ctx.save();
  if(glow>0){ctx.shadowColor=`rgba(255,198,41,${.45*glow})`;ctx.shadowBlur=50*glow;}
  else{ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;}
  ctx.fillStyle=fill;rr(x,y,w,h,r);ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle=glow>0?`rgba(255,198,41,${.9*glow})`:stroke;ctx.lineWidth=glow>0?4:2;ctx.stroke();ctx.restore();}
function chip(x,y,s,{bg=C.panel2,fg=C.fg,size=34,w=800,align='center',padX=26,h=null}={}){font(w,size);const tw_=ctx.measureText(s).width+padX*2,hh=h||size*1.7;
  const x0=align==='center'?x-tw_/2:align==='right'?x-tw_:x;ctx.fillStyle=bg;rr(x0,y-hh/2,tw_,hh,hh/2);ctx.fill();
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x0+tw_/2,y+2);return tw_;}
function newBadge(x,y,p,label='NEW'){if(p<=0)return;withT(x,y,pop(p),1,()=>{ctx.rotate(-.08);chip(0,0,label,{bg:C.red,fg:'#fff',size:28,w:900,padX:18});});}
// hazard stripes clipped into a rect
function hazard(x,y,w,h,off=0,a=1,c1=C.yellow,c2=C.hazard2){ctx.save();ctx.globalAlpha*=a;ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle=c2;ctx.fillRect(x,y,w,h);ctx.fillStyle=c1;const s=60;
  for(let k=-h-s*2+(off%(s*2));k<w+h;k+=s*2){ctx.beginPath();ctx.moveTo(x+k,y+h);ctx.lineTo(x+k+s,y+h);ctx.lineTo(x+k+s+h,y);ctx.lineTo(x+k+h,y);ctx.closePath();ctx.fill();}
  ctx.restore();}
function arrow(x1,y1,x2,y2,p,{color=C.yellow,wd=10,head=26,dash=false}={}){if(p<=0)return;const x=lerp(x1,x2,eo(p)),y=lerp(y1,y2,eo(p));
  ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=wd;ctx.lineCap='round';if(dash)ctx.setLineDash([18,16]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x+Math.cos(a)*6,y+Math.sin(a)*6);
  ctx.lineTo(x-Math.cos(a-.5)*head,y-Math.sin(a-.5)*head);ctx.lineTo(x-Math.cos(a+.5)*head,y-Math.sin(a+.5)*head);ctx.closePath();ctx.fill();ctx.restore();}
function checkMark(x,y,s,p,color=C.green){if(p<=0)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=10*s;ctx.lineCap='round';ctx.lineJoin='round';
  const pts=[[x-22*s,y],[x-6*s,y+16*s],[x+24*s,y-18*s]];const L1=Math.hypot(16,16),L2=Math.hypot(30,34),tot=L1+L2;const d=eo(p)*tot;
  ctx.beginPath();ctx.moveTo(...pts[0]);if(d<=L1){const k=d/L1;ctx.lineTo(lerp(pts[0][0],pts[1][0],k),lerp(pts[0][1],pts[1][1],k));}
  else{ctx.lineTo(...pts[1]);const k=(d-L1)/L2;ctx.lineTo(lerp(pts[1][0],pts[2][0],k),lerp(pts[1][1],pts[2][1],k));}ctx.stroke();ctx.restore();}
function burst(x,y,p,color=C.yellow,r0=40,r1=90,n=8){if(p<=0||p>=1)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=7;ctx.lineCap='round';
  const a=eo(p);for(let i=0;i<n;i++){const ang=i*Math.PI*2/n;const ra=lerp(r0,r1,a),rb=lerp(r0,r1,Math.min(1,a+.35));
    ctx.globalAlpha=1-p;ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*ra,y+Math.sin(ang)*ra);ctx.lineTo(x+Math.cos(ang)*rb,y+Math.sin(ang)*rb);ctx.stroke();}ctx.restore();}
function stamp(x,y,label,p,o={}){if(p<=0)return;if(CONFIG.polish&&p<1)[.6,.35].forEach((k,i)=>{ctx.save();ctx.globalAlpha*=.18/(i+1);stampFlat(x,y,label,clamp(p*k),o);ctx.restore();});stampFlat(x,y,label,p,o);}   // motion-blur ghosts while slamming
function stampFlat(x,y,label,p,{color=C.red,size=56,rot=-.12,w=null}={}){if(p<=0)return;const s=lerp(1.9,1,eo(p));withT(x,y,s,clamp(p*2),()=>{ctx.rotate(rot);font(900,size);
  const ww=w||ctx.measureText(label).width+60;ctx.strokeStyle=color;ctx.lineWidth=8;rr(-ww/2,-size*.85,ww,size*1.7,16);ctx.stroke();
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,4);});}
function countUp(v,p){return Math.round(v*eo(p));}

/* ---------- brand badges (enamel pins from badges.js; keys in SKILL.md) ----------
   badge(key, x, y, h, t, {glints:[[t0,t1],...], alpha, rot}) draws the pin centred at (x,y) with height h (design px),
   a soft drop shadow and optional gold glints passing over it. Native images are ~300–390 px tall: keep h ≤ ~480. */
const BADGE={};Object.entries(window.BADGE_SRC||{}).forEach(([k,v])=>{BADGE[k]=new Image();BADGE[k].src=v;});
const BADGE_BUF=new OffscreenCanvas(760,760),bctx=BADGE_BUF.getContext('2d');
function badge(key,x,y,h,t=0,{glints=[],alpha=1,rot=0}={}){const img=BADGE[key];if(!img||!img.width||alpha<=0)return;
  const s=Math.min(h/img.height,700/img.width),w=img.width*s,hh=img.height*s;
  bctx.setTransform(1,0,0,1,0,0);bctx.globalCompositeOperation='source-over';bctx.clearRect(0,0,760,760);bctx.drawImage(img,380-w/2,380-hh/2,w,hh);
  glints.forEach(([a,b])=>{const g=P(t,a,b);if(g<=0||g>=1)return;const gx=lerp(380-w/2-160,380+w/2+160,eio(g));bctx.globalCompositeOperation='source-atop';
    const gr=bctx.createLinearGradient(gx-70,0,gx+70,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,250,225,.6)');gr.addColorStop(1,'rgba(255,255,255,0)');
    bctx.save();bctx.translate(380,380);bctx.rotate(.35);bctx.translate(-380,-380);bctx.fillStyle=gr;bctx.fillRect(-400,-400,1560,1560);bctx.restore();});
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.shadowColor=CONFIG.theme==='dark'?'rgba(0,0,0,.5)':'rgba(30,40,56,.22)';ctx.shadowBlur=30;ctx.shadowOffsetY=16;
  ctx.drawImage(BADGE_BUF,-380,-380);ctx.restore();}

/* ---------- pictograms ---------- */
function worker(x,y,s,{color=C.fg,hat=C.yellow,run=null,alpha=1,stopHand=false}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineWidth=22;
  const ph=run===null?0:run;const sw=Math.sin(ph)*.7;
  // legs
  ctx.beginPath();ctx.moveTo(0,40);ctx.lineTo(Math.sin(sw)*60,120);ctx.moveTo(0,40);ctx.lineTo(-Math.sin(sw)*60,120);ctx.stroke();
  // body
  ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(run===null?0:12,40);ctx.stroke();
  // arms
  if(stopHand){ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(56,-62);ctx.moveTo(0,-20);ctx.lineTo(-34,22);ctx.stroke();
    ctx.beginPath();ctx.ellipse(66,-78,20,26,-.6,0,7);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(-Math.sin(sw)*50,30);ctx.moveTo(0,-20);ctx.lineTo(Math.sin(sw)*50,30);ctx.stroke();}
  // head + hard hat
  ctx.beginPath();ctx.arc(0,-62,26,0,7);ctx.fill();
  ctx.fillStyle=hat;ctx.beginPath();ctx.arc(0,-70,30,Math.PI,0);ctx.fill();ctx.fillRect(-40,-72,80,10);
  ctx.restore();}
function stopSign(x,y,r,p){if(p<=0)return;withT(x,y,pop(p),1,()=>{ctx.fillStyle=C.red;ctx.beginPath();for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=r*.07;ctx.stroke();txt('STOP',0,r*.2,{w:900,size:r*.5,color:'#fff',align:'center'});});}
function exitSign(x,y,s,p){if(p<=0)return;withT(x,y,s*pop(p),1,()=>{ctx.fillStyle=C.green;rr(-90,-55,180,110,14);ctx.fill();
  ctx.fillStyle='#fff';worker(-30,6,.32,{color:'#fff',hat:'#fff',run:4});ctx.strokeStyle='#fff';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(70,0);ctx.moveTo(56,-14);ctx.lineTo(70,0);ctx.lineTo(56,14);ctx.stroke();});}
function building(x,y,w,h,label,{color=C.panel2,accent=C.blue}={}){ctx.fillStyle=color;rr(x,y,w,h,14);ctx.fill();ctx.fillStyle=accent;rr(x,y,w,16,[14,14,0,0]);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';for(let r=0;r<2;r++)for(let c=0;c<5;c++)rr(x+24+c*((w-48)/5),y+36+r*36,(w-48)/5-14,22,4),ctx.fill();
  txt(label,x+w/2,y+h-22,{w:900,size:40,align:'center'});}
function crane(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle=C.yellow;ctx.lineWidth=10;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-260);ctx.lineTo(260,-260);ctx.moveTo(0,-260);ctx.lineTo(-80,-260);ctx.moveTo(0,-300);ctx.lineTo(0,-260);ctx.stroke();
  for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-14,-i*44);ctx.lineTo(14,-i*44-22);ctx.stroke();}
  const hx=150+Math.sin(t*1.2)*60;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hx,-260);ctx.lineTo(hx,-140);ctx.stroke();ctx.fillStyle=C.orange;rr(hx-30,-140,60,40,6);ctx.fill();
  ctx.fillStyle=C.yellow;rr(-110,-275,60,40,6);ctx.fill();ctx.restore();}
function thermo(x,y,s,lvl){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#fff';rr(-18,-90,36,130,18);ctx.fill();ctx.beginPath();ctx.arc(0,50,32,0,7);ctx.fill();
  ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(0,50,22,0,7);ctx.fill();rr(-9,50-120*lvl,18,120*lvl,9);ctx.fill();ctx.restore();}
function snow(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(rot);ctx.strokeStyle=C.blue;ctx.lineWidth=10;ctx.lineCap='round';
  for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-70);ctx.moveTo(0,-42);ctx.lineTo(-18,-58);ctx.moveTo(0,-42);ctx.lineTo(18,-58);ctx.stroke();ctx.restore();}ctx.restore();}
function coin(x,y,r,label='₩'){ctx.fillStyle=C.yellow;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle=C.yellowD;ctx.lineWidth=r*.12;ctx.beginPath();ctx.arc(x,y,r*.78,0,7);ctx.stroke();
  txt(label,x,y+r*.32,{w:900,size:r*.9,color:C.yellowD,align:'center'});}
function megaphone(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-.2);ctx.fillStyle=C.fg;
  ctx.beginPath();ctx.moveTo(-60,-30);ctx.lineTo(50,-80);ctx.lineTo(50,80);ctx.lineTo(-60,30);ctx.closePath();ctx.fill();rr(-90,-30,34,60,8);ctx.fill();
  ctx.fillStyle=C.red;rr(-60,30,30,60,8);ctx.fill();ctx.strokeStyle=C.yellow;ctx.lineWidth=8;ctx.lineCap='round';
  for(let i=0;i<3;i++){const a=(t*2+i/3)%1;ctx.globalAlpha=1-a;ctx.beginPath();ctx.arc(60,0,40+a*80,-.6,.6);ctx.stroke();}ctx.restore();}
function gear(x,y,r,rot,color=C.muted){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;
  for(let i=0;i<10;i++){ctx.save();ctx.rotate(i*Math.PI/5);rr(-r*.16,-r*1.18,r*.32,r*.4,4);ctx.fill();ctx.restore();}
  ctx.beginPath();ctx.arc(0,0,r*.9,0,7);ctx.fill();ctx.fillStyle=C.bg2;ctx.beginPath();ctx.arc(0,0,r*.35,0,7);ctx.fill();ctx.restore();}
function ship(x,y,s,t){ctx.save();ctx.translate(x,y+Math.sin(t*2)*6);ctx.scale(s,s);
  const cols=[C.orange,C.blue,C.green,C.red,C.yellow];for(let i=0;i<5;i++){ctx.fillStyle=cols[i];rr(-150+i*62,-90,56,46,4);ctx.fill();}
  for(let i=0;i<3;i++){ctx.fillStyle=cols[(i+2)%5];rr(-88+i*62,-140,56,46,4);ctx.fill();}
  ctx.fillStyle=C.fg;ctx.beginPath();ctx.moveTo(-200,-40);ctx.lineTo(200,-40);ctx.lineTo(160,30);ctx.lineTo(-170,30);ctx.closePath();ctx.fill();
  ctx.strokeStyle=C.blue;ctx.lineWidth=6;ctx.beginPath();for(let k=-240;k<=240;k+=20)ctx.lineTo(k,48+Math.sin(k*.05+t*4)*6);ctx.stroke();ctx.restore();}
function bookmark(x,y,s,color=C.yellow){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(-14,-20);ctx.lineTo(14,-20);ctx.lineTo(14,22);ctx.lineTo(0,10);ctx.lineTo(-14,22);ctx.closePath();ctx.fill();ctx.restore();}
function commentIcon(x,y,s,color=C.yellow){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;rr(-34,-26,68,46,14);ctx.fill();
  ctx.beginPath();ctx.moveTo(-14,18);ctx.lineTo(-22,34);ctx.lineTo(2,18);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.ink;[-14,0,14].forEach(dx=>{ctx.beginPath();ctx.arc(dx,-3,5,0,7);ctx.fill();});ctx.restore();}
function lockIcon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.beginPath();ctx.arc(0,-20,30,Math.PI,0);ctx.stroke();
  ctx.fillStyle='#fff';rr(-46,-20,92,70,12);ctx.fill();ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(0,10,10,0,7);ctx.fill();ctx.restore();}
function govIcon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=C.fg;ctx.beginPath();ctx.moveTo(-70,-30);ctx.lineTo(0,-70);ctx.lineTo(70,-30);ctx.closePath();ctx.fill();
  for(let i=0;i<4;i++)rr(-56+i*36,-24,20,64,3),ctx.fill();rr(-78,42,156,16,4);ctx.fill();ctx.restore();}

  rr(-bw/2,-bh/2,bw,bh,bh>140?44:bh/2);ctx.fill();ctx.shadowColor='transparent';ctx.stroke();

  if(think){[[.85,16],[1.08,10]].forEach(([k,r])=>{ctx.beginPath();ctx.arc(tx*k,ty*k,r,0,7);ctx.fill();ctx.stroke();});}
  else if(tx||ty){const ex=clamp(tx,-bw/2+50,bw/2-50),ey=ty>0?bh/2-4:-bh/2+4;
    ctx.beginPath();ctx.moveTo(ex-24,ey);ctx.lineTo(tx,ty);ctx.lineTo(ex+24,ey);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(ex-24,ey);ctx.lineTo(tx,ty);ctx.lineTo(ex+24,ey);ctx.stroke();
    ctx.fillRect(ex-22,ey-(ty>0?8:-2),44,6);}
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';

function flap(t,a,b){if(t<a||t>b)return 0;return Math.abs(Math.sin((t-a)*13))*(.55+.45*Math.sin(t*5.3));}
function nodv(t,a){const p=P(t,a,a+.6);return Math.sin(p*Math.PI*2)*6*(1-p);}
function tag(x,y,label,p,bg=C.navy,fg='#fff'){if(p<=0)return;const a=eo(p);font(800,40);const w=ctx.measureText(label).width+56;
  ctx.save();ctx.globalAlpha*=a;ctx.translate(x-(1-a)*60,y);ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,0);ctx.lineTo(w-14,70);ctx.lineTo(0,70);ctx.closePath();ctx.fill();
  ctx.fillStyle=fg;ctx.textBaseline='middle';ctx.fillText(label,26,37);ctx.restore();}
// headline: lines pop in at the given start times
// kinetic type: characters spring up under a mask, staggered. t0 <= 0 means "already on screen at frame 0" (drawn static).
function kineticLine(s,x,y,t,t0,{size=96,w=900,color=C.fg,stagger=.025,align='center',ls=-2}={}){if(t<t0-.01)return;font(w,size);ctx.letterSpacing=ls+'px';
  const ch=[...s],ws=ch.map(c=>ctx.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0);let cx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  ctx.save();ctx.beginPath();ctx.rect(0,y-size*1.05,W,size*1.4);ctx.clip();ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ch.forEach((c,i)=>{const p=t0<=0?1:P(t,t0+i*stagger,t0+i*stagger+.55),k=spr(p);if(p>0){ctx.save();ctx.globalAlpha*=clamp(p*4);ctx.fillText(c,cx,y+(1-k)*size*1.1);ctx.restore();}cx+=ws[i];});
  ctx.restore();ctx.letterSpacing='0px';return tot;}
function headline(lines,t,starts,{y=330,size=86,hlc=C.yellow}={}){
  lines.forEach((l,i)=>{const t0=starts[i];const p=P(t,t0,t0+.4);if(p<=0)return;
    if(CONFIG.polish){const w=tw(l,900,size,-2),yy=y+i*size*1.25;hl(W/2-w/2-14,yy-size*.38,w+28,size*.48,P(t,t0+.25,t0+.65),hlc);kineticLine(l,W/2,yy,t,t0,{size});return;}const s=lerp(1.25,1,eb(p));
    const w=tw(l,900,size,-2),x=W/2,yy=y+i*size*1.25;
    ctx.save();ctx.globalAlpha*=clamp(p*2.5);ctx.translate(x,yy);ctx.scale(s,s);ctx.translate(-x,-yy);
    hl(x-w/2-14,yy-size*.38,w+28,size*.48,P(t,t0+.2,t0+.6),hlc);
    txt(l,x,yy,{w:900,size,align:'center',ls:-2});ctx.restore();});}

/* item header: giant outlined number + title (+ sub line, + effective-date chip) */

  const num=String(n).padStart(2,'0'),nw=tw(num,900,140);
  ctx.save();ctx.globalAlpha=clamp(p*2);const s=lerp(1.6,1,eo(p));
  ctx.translate(90+nw/2,310);ctx.scale(s,s);
  font(900,140);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle=CONFIG.theme==='paper'?C.yellowD:C.yellow;ctx.strokeText(num,0,0);
  ctx.restore();
  const tx=90+nw+34;
  const p2=P(t,tTitle,tTitle+.35);if(p2>0){const r=rise(p2,30);txt(title,tx,sub?312:336+0,{w:900,size:62,alpha:r.a,ls:-1});}
  if(sub){const p3=P(t,tSub,tSub+.35);if(p3>0){const r=rise(p3,20);txt(sub,tx+2,362+r.y,{w:700,size:30,color:C.muted,alpha:r.a});}}
  const hp=clamp(P(t,t0+.2,t0+.6));
  if(eff){const p4=P(t,t0+.3,t0+.7);hazard(90,404,560,10,t*60,hp);
    if(p4>0){ctx.save();ctx.globalAlpha=eo(p4);chip(990,409,eff,{bg:'rgba(255,198,41,.16)',fg:CONFIG.theme==='paper'?C.yellowD:C.yellow,size:28,align:'right',padX:20});ctx.restore();}}
  else hazard(90,404,900,10,t*60,hp);
}

let PAPER_TEX=null,DEPTH=null,GRAIN=null;
function paperTex(){if(PAPER_TEX)return PAPER_TEX;PAPER_TEX=new OffscreenCanvas(W/2,H/2);const d=PAPER_TEX.getContext('2d');let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<1800;i++){d.fillStyle=`rgba(120,95,60,${.02+r()*.05})`;d.fillRect(r()*W/2,r()*H/2,.6+r()*1.5,4+r()*20);}return PAPER_TEX;}   // drawn at half size, upscaled ×2 for soft fibres
function lightPools(t){const dk=CONFIG.theme==='dark';ctx.save();ctx.globalCompositeOperation=dk?'lighter':'source-over';
  [[300+Math.sin(t*.25)*160,520+Math.cos(t*.2)*120,620,dk?'rgba(90,169,255,.07)':'rgba(255,255,255,.22)'],[820+Math.cos(t*.22)*140,1250+Math.sin(t*.3)*140,700,dk?'rgba(255,198,41,.05)':'rgba(246,201,69,.10)']].forEach(([x,y,r,c])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);});ctx.restore();}

function depthBG(t,{alpha=1,big=null}={}){const dk=CONFIG.theme==='dark';if(!DEPTH){DEPTH=new OffscreenCanvas(W+200,H);const d=DEPTH.getContext('2d');d.filter='blur(7px)';

  const cam=Math.sin(t*.35);ctx.save();ctx.globalAlpha*=(dk?.08:.10)*alpha;ctx.drawImage(DEPTH,-100+cam*-26,Math.sin(t*.6)*10);ctx.restore();
  if(big){ctx.save();ctx.globalAlpha*=(dk?.05:.06)*alpha;font(900,560);ctx.textAlign='right';ctx.textBaseline='alphabetic';ctx.fillStyle=dk?C.yellow:C.yellowD;ctx.fillText(big,1060+cam*-14,1040);ctx.restore();}}

function checkRow(x,y,label,p,{size=42,w=820,sub=null}={}){if(p<=0)return;const k=spr(p),dk=CONFIG.theme==='dark',hh=sub?112:100;ctx.save();ctx.globalAlpha*=clamp(p*3);ctx.translate((1-k)*120,0);

function post(T){const c=mctx,dk=CONFIG.theme==='dark';c.save();c.setTransform(1,0,0,1,0,0);const v=c.createRadialGradient(540,860,420,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,dk?'rgba(0,0,0,.42)':'rgba(70,50,25,.16)');c.fillStyle=v;c.fillRect(0,0,W,H);
  if(CONFIG.grain){if(!GRAIN){GRAIN=new OffscreenCanvas(256,256);const g=GRAIN.getContext('2d'),d=g.createImageData(256,256);let s=7;for(let i=0;i<d.data.length;i+=4){s=(s*16807)%2147483647;const q=s%255;d.data[i]=d.data[i+1]=d.data[i+2]=q;d.data[i+3]=255;}g.putImageData(d,0,0);}
    c.globalCompositeOperation='overlay';c.globalAlpha=.07;const f=Math.floor(T*24)%8;c.translate(-(f*37%256),-(f*91%256));c.fillStyle=c.createPattern(GRAIN,'repeat');c.fillRect(0,0,W+256,H+256);}

/* ---------- closing scenes (silent, last scene): S.push(ending(CONFIG.ending,{q:['line 1','line 2']})) ----------
   'wave'   lawyer waves with an open palm, brand pill, question card; the loop wipe follows
   'seal'   lawyer pops up and slams the channel seal onto the screen (shake, ink), question card; the loop wipe follows
   'portrait' the lawyer's enamel-pin portrait (portrait.js) flips in and lands with a ring pulse, sparkles and a gold glint;

   'tablet' the camera pulls back: the video was playing on the lawyer's tablet; question card + brand; the tablet

   new_project.py picks CONFIG.ending at random, rotating through all four before repeating. */

    else if(type==='push-up'){ctx.drawImage(offA,0,-H*k);ctx.drawImage(offB,0,H*(1-k));}
    else if(type==='zoom'){ctx.save();ctx.globalAlpha=1-k;ctx.translate(540,800);ctx.scale(1+.35*k,1+.35*k);ctx.translate(-540,-800);ctx.drawImage(offA,0,0);ctx.restore();
      ctx.save();ctx.globalAlpha=k;ctx.translate(540,800);ctx.scale(.88+.12*k,.88+.12*k);ctx.translate(-540,-800);ctx.drawImage(offB,0,0);ctx.restore();}
    else if(type==='iris'){ctx.drawImage(offA,0,0);const [cx,cy]=IRIS[i]||[540,800];const R=Math.hypot(Math.max(cx,W-cx),Math.max(cy,H-cy))*k;
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();bg(T);ctx.drawImage(offB,0,0);ctx.restore();
      ctx.save();ctx.strokeStyle=C.yellow;ctx.lineWidth=18*(1-k);ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.restore();}
    else if(type==='hazard'){ctx.drawImage(offA,0,0);const ex=lerp(-700,W+700,k);
      ctx.save();ctx.beginPath();ctx.moveTo(-400,0);ctx.lineTo(ex,0);ctx.lineTo(ex-500,H);ctx.lineTo(-900,H);ctx.closePath();ctx.clip();bg(T);ctx.drawImage(offB,0,0);ctx.restore();
      ctx.save();ctx.beginPath();ctx.moveTo(ex,0);ctx.lineTo(ex+140,0);ctx.lineTo(ex-360,H);ctx.lineTo(ex-500,H);ctx.closePath();ctx.clip();hazard(-600,0,W+1200,H,0);ctx.restore();}
  }
  header(T,sc.item);
  captions(T);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,0,W,8);ctx.fillStyle=C.yellow;ctx.fillRect(0,0,W*T/TOTAL,8);

}
